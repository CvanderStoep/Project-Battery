[project]
name = "project-battery"
version = "0.1.0"
description = "Bereken de opbrengst van een thuisbatterij op basis van energieprijs en batterijvermogen"
readme = "README.md"
authors = [
    { name = "Carlo van der Stoep", email = "carlo.vanderstoep@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "influxdb-client>=1.50.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project-battery = "battery_revenue:main"

[tool.hatch.build.targets.wheel]
only-include = ["battery_revenue.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
