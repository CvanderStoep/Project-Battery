[project]
name = "project-battery"
version = "0.1.0"
description = "Bereken de opbrengst van een thuisbatterij op basis van energieprijs en batterijvermogen"
readme = "README.md"
authors = [
    { name = "Carlo van der Stoep", email = "carlo.vanderstoep@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "influxdb-client>=1.50.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project-battery = "battery_revenue:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
